name: Spotify find
on:
  workflow_dispatch:
    inputs:
      q:
        description: "Search words"
        required: true
      artist:
        description: "English Wikipedia title of the artist"
        required: false
        default: ""
      urls:
        description: "Extra pages to scan"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Search and verify
        env:
          Q: ${{ inputs.q }}
          URLS: ${{ inputs.urls }}
          ARTIST: ${{ inputs.artist }}
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          enc=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote('site:open.spotify.com/track '+os.environ['Q']))")
          ids=$( (curl -sSL -A "$UA" "https://html.duckduckgo.com/html/?q=$enc"; curl -sSL -A "$UA" "https://www.bing.com/search?q=$enc"; for u in $URLS; do curl -sSL -A "$UA" "$u"; done) | grep -oE 'open\.spotify\.com(/intl-[a-z]+)?/track/[A-Za-z0-9]{22}' | grep -oE '[A-Za-z0-9]{22}$' | sort -u | head -15)
          dz=$(curl -sS "https://api.deezer.com/search?q=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['Q']))")&limit=5" | python3 -c "import sys,json;[print(t['link']) for t in json.load(sys.stdin).get('data',[])]")
          for l in $dz; do
            echo "DEEZER $l"
            sp=$(curl -sS "https://api.song.link/v1-alpha.1/links?url=$l" | grep -oE 'open\.spotify\.com/track/[A-Za-z0-9]{22}' | head -1 | grep -oE '[A-Za-z0-9]{22}$'); echo "SONGLINK $(curl -sS "https://api.song.link/v1-alpha.1/links?url=$l" | head -c 300)"
            ids="$ids $sp"; sleep 2
          done
          wd=$(curl -sS -A "TOH-bot/1.0" "https://www.wikidata.org/w/api.php?action=wbgetentities&sites=enwiki|dewiki&titles=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['Q'].split(' Kalk')[0].replace(' ','_')))")&props=claims&format=json" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for e in d.get('entities',{}).values():
              for c in e.get('claims',{}).get('P2207',[]):
                  print(c['mainsnak']['datavalue']['value'])")
          echo "WIKIDATA $wd"
          if [ -n "$ARTIST" ]; then
            aid=$(curl -sS -A "TOH-bot/1.0" "https://www.wikidata.org/w/api.php?action=wbgetentities&sites=enwiki&titles=$ARTIST&props=claims&format=json" | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for e in d.get('entities',{}).values():
              for c in e.get('claims',{}).get('P1902',[]):
                  print(c['mainsnak']['datavalue']['value'])" | head -1)
            if [ -z "$aid" ]; then
              q=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote('artist:\"'+os.environ['ARTIST'].replace('_',' ')+'\"'))")
              mb=$(curl -sS -A "TOH-bot/1.0 (stefos79@users.noreply.github.com)" "https://musicbrainz.org/ws/2/artist/?query=$q&limit=1&fmt=json" | python3 -c "import sys,json;print(json.load(sys.stdin)['artists'][0]['id'])")
              sleep 1
              aid=$(curl -sS -A "TOH-bot/1.0 (stefos79@users.noreply.github.com)" "https://musicbrainz.org/ws/2/artist/$mb?inc=url-rels&fmt=json" | grep -oE 'open\.spotify\.com/artist/[A-Za-z0-9]{22}' | head -1 | grep -oE '[A-Za-z0-9]{22}$')
              echo "MUSICBRAINZ $mb"
            fi
            echo "WDRAW $(curl -sS -A 'TOH-bot/1.0 (stefos79@users.noreply.github.com)' "https://www.wikidata.org/w/api.php?action=wbgetentities&sites=enwiki&titles=$ARTIST&props=claims&format=json" | head -c 300)"
            echo "ARTIST $aid"
            curl -sS -A "$UA" "https://open.spotify.com/embed/artist/$aid" | python3 -c "
          import sys,re,json
          h=sys.stdin.read()
          m=re.search(r'<script id=\"__NEXT_DATA__\"[^>]*>(.*?)</script>',h,re.S)
          if m:
              d=json.loads(m.group(1))
              def walk(o):
                  if isinstance(o,dict):
                      if 'uri' in o and str(o.get('uri','')).startswith('spotify:track:'): print('TRACKLIST',o['uri'],'|',o.get('title') or o.get('name'))
                      for v in o.values(): walk(v)
                  elif isinstance(o,list):
                      for v in o: walk(v)
              walk(d)
          else: print('NONEXT', len(h))"
          fi
          ids="$ids $wd"
          ids=$(echo $ids | tr ' ' '\n' | sort -u)
          for id in $ids; do
            t=$(curl -sS "https://open.spotify.com/oembed?url=https://open.spotify.com/track/$id" | python3 -c "import sys,json;print(json.load(sys.stdin).get('title',''))" 2>/dev/null)
            echo "FOUND $id | $t"
          done
