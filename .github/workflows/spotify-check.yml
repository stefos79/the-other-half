name: Spotify check
on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Space-separated Spotify track ids"
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Look up track titles
        env:
          IDS: ${{ inputs.ids }}
        run: |
          for id in $IDS; do
            echo "TRACK $id: $(curl -sS "https://open.spotify.com/oembed?url=https://open.spotify.com/track/$id" | head -c 400)"
          done
